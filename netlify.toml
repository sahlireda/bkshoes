[build]
  # Directory to change to before starting a build
  base = "."
  
  # Directory that contains the deploy-ready HTML files and assets
  publish = "."
  
  # Default build command
  command = "echo 'No build step required for static site'"

[functions]
  directory = "netlify/functions"

[build.environment]
  # Node.js version (if needed for future enhancements)
  NODE_VERSION = "18"

[[headers]]
  # Define which paths this specific [[headers]] block will cover
  for = "/*"
  
  [headers.values]
    # Security headers
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Cache control for static assets
    Cache-Control = "public, max-age=31536000"

[[headers]]
  # Do NOT cache JSON data to always fetch fresh products
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Redirect rules
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/accueil"
  to = "/"
  status = 301

# Supprimer la règle SPA globale: nous servons des pages statiques .html
# (Si vous activez une SPA plus tard, réactivez cette règle.)
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200

# Form handling (for future contact forms)
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  # Conserver les extensions .html visibles
  pretty_urls = false

# Environment variables (if needed)
[context.production.environment]
  HUGO_VERSION = "0.58.2"
  HUGO_ENV = "production"
  HUGO_ENABLEGITINFO = "true"

[context.split1]
  command = "echo 'Split test branch'"

[context.split1.environment]
  HUGO_VERSION = "0.58.2"
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "echo 'Deploy preview'"

[context.deploy-preview.environment]
  HUGO_VERSION = "0.58.2"

[context.branch-deploy]
  command = "echo 'Branch deploy'"

[context.branch-deploy.environment]
  HUGO_VERSION = "0.58.2"
